name: CI

# Every push to any branch (pushes to a PR branch included).
on: push

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: rental
          POSTGRES_USER: rental
          POSTGRES_PASSWORD: rental
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rental -d rental"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_URL: jdbc:postgresql://localhost:5432/rental
      DB_USERNAME: rental
      DB_PASSWORD: rental

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 22
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "22"
          cache: maven

      - name: Run tests
        run: mvn -B test

      # Builds the SPA and the jar exactly as they ship.
      - name: Build Docker image
        run: docker build -t equipment-rental .
