spring:
  application:
    name: equipment-rental

  # Datasource is driven by environment variables, with local-dev defaults that
  # match docker-compose.yml. Do NOT put real credentials here or in Git.
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/rental}
    username: ${DB_USERNAME:rental}
    password: ${DB_PASSWORD:rental}
    driver-class-name: org.postgresql.Driver
    hikari:
      # Fail fast (and let /health report DOWN) instead of waiting 30s when Postgres is unreachable.
      connection-timeout: 5000

  # Liquibase is the ONLY database initializer.
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    enabled: true

  # Disable Spring's separate SQL initialization so it never competes with Liquibase.
  sql:
    init:
      mode: never

  jackson:
    serialization:
      write-dates-as-timestamps: false   # emit ISO-8601 strings

  # Timeouts for the notification gateway's RestClient, so a slow notifier can't stall a booking for long.
  http:
    client:
      connect-timeout: 1s
      read-timeout: 1s

server:
  port: 8080

# Actuator at the root: GET /health (public) and GET /metrics (Prometheus text, admin only).
management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: health, prometheus
      path-mapping:
        prometheus: metrics
  endpoint:
    health:
      show-components: always   # component statuses (db, disk), no details

# Where the notification gateway sends; the mock notification service runs inside this app.
notification:
  base-url: ${NOTIFICATION_URL:http://localhost:8080}

logging:
  level:
    com.cmpe172.rental: INFO
