# Local stack for the equipment-rental project.
#   docker compose up -d db       PostgreSQL only, for running the app with mvn spring-boot:run
#   docker compose up --build     PostgreSQL plus the app image (API + React UI on :8080)
# These credentials are non-secret dev defaults only. They match the fallback
# values in application.yml. Override via a .env file / environment for anything
# beyond local development.
services:
  db:
    image: postgres:16
    container_name: rental-postgres
    environment:
      POSTGRES_DB: rental
      POSTGRES_USER: rental
      POSTGRES_PASSWORD: rental
    ports:
      - "5432:5432"
    volumes:
      - rental_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rental -d rental"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: rental-app
    environment:
      DB_URL: jdbc:postgresql://db:5432/rental
      DB_USERNAME: rental
      DB_PASSWORD: rental
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs   # JSON log lines (with trace IDs) for log tooling
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s

volumes:
  rental_pgdata:
